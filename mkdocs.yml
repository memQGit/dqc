site_name: xDQC
site_description: >-
  xDQC — an open-source Python library for distributed quantum
  compilation: partition circuits across QPUs, route inter-QPU gates,
  reconstruct distributed circuits, and build execution schedules.
site_author: memQ Inc.
repo_name: memQGit/xdqc
repo_url: https://github.com/memQGit/xdqc
copyright: Copyright &copy; 2026 memQ Inc.

theme:
  name: material
  logo: assets/memq-logo-white.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - gen-files:
      scripts:
        - gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            show_if_no_docstring: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guide:
      - Workflow & Architecture: guide/workflow.md
      - Partitioning Algorithms: guide/partitioning.md
      - Visualization: guide/visualization.md
      - Logging & Verbosity: guide/logging.md
      - Scheduling-Instance API: guide/scheduling-instance-api.md
  - Demo Walkthrough: demo.md
  - API Reference: reference/
