version: 2
updates:
  # Python dependencies. This project is uv-managed: the resolved versions
  # live in uv.lock, which the "pip" ecosystem does not maintain. Using the
  # native "uv" ecosystem keeps pyproject.toml and uv.lock updated together.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Group non-security bumps
    groups:
      python-deps:
        patterns:
          - "*"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      gha:
        patterns:
          - "*"

