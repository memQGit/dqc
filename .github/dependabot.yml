version: 2
updates:
  # Python dependencies. This project is uv-managed: the resolved versions
  # live in uv.lock, which the "pip" ecosystem does not maintain. Using the
  # native "uv" ecosystem keeps pyproject.toml and uv.lock updated together.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Groups apply to version updates only unless "applies-to" says
    # otherwise, so security bumps get a group of their own.
    groups:
      python-deps:
        applies-to: version-updates
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      gha:
        applies-to: version-updates
        patterns:
          - "*"
      gha-security:
        applies-to: security-updates
        patterns:
          - "*"

