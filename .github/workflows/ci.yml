name: CI

on: 
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}

    strategy:
      # Cross-platform failures are usually platform-specific, so let every
      # OS report rather than cancelling siblings on the first red job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Smoke coverage on one Python per extra platform. Windows is the
          # one that earns its keep: KaHyPar ships no wheels there, so this
          # is the only job exercising the reduced dependency set.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    # Hoisted so the upload step can test for the token: the `secrets`
    # context is not readable from a step-level `if`, but `env` is.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # Style is platform-independent, so it runs once rather than on every
      # matrix leg. This also keeps the Windows leg away from checkout's
      # CRLF conversion, which has nothing to do with what it is testing.
      - name: Ruff (lint)
        if: matrix.os == 'ubuntu-latest'
        run: uv run ruff check .

      - name: Ruff (format check)
        if: matrix.os == 'ubuntu-latest'
        run: uv run ruff format --check .

      - name: Pytest with coverage
        run: uv run pytest -q --cov=memq_dqc --cov-report=xml
      
      # Dependabot and fork pull requests run without access to repository
      # secrets, so the token arrives empty and Codecov rejects the upload.
      # Skip the step in that case rather than failing an otherwise green
      # run; `fail_ci_if_error` still applies wherever the token exists.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}

      # `--strict` promotes MkDocs warnings to errors, matching
      # `fail_on_warning: true` in .readthedocs.yaml. Without this step the
      # link validation configured in docs/mkdocs.yml only ever runs on a Read
      # the Docs build, which cannot happen while the repo is private.
      # Ubuntu-only: the output is platform-independent.
      - name: Build docs (strict)
        if: matrix.os == 'ubuntu-latest'
        run: uv run --group docs mkdocs build --strict -f docs/mkdocs.yml

      - name: Build package
        run: uv build

      # Installs the built wheel into an environment that has never seen the
      # dev group, so only the dependencies the wheel itself declares are
      # present. The test suite runs against `uv sync --dev` and so cannot
      # see a runtime import satisfied by a dev-only dependency -- exactly
      # how the missing `qiskit-qasm3-import` reached PyPI in 0.1.0. The
      # snippet is the shortest complete run from README.md, so a failure
      # here means the front-page example is broken for a fresh install.
      # Ubuntu-only: this checks packaging metadata, not platform behaviour.
      - name: Smoke test the built wheel
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c '
          from memq_dqc import Compiler
          from memq_dqc.assets import circuit_path, network_path

          compiler = Compiler(
              circuit_path("qft_n10"),
              network_path("10_qubits/n2_pair_nn"),
          )

          compiler.compile()

          print("verified:", compiler.verify(shots=20000))
          '
