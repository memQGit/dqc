name: Publish (TestPyPI)

# Dry run for the real publish pipeline. Triggered by hand rather than by a
# release so the machinery can be exercised without cutting a version, and
# kept in its own file because a PyPI trusted publisher is keyed on the
# workflow filename -- TestPyPI needs its own registration pointing here.
on:
  workflow_dispatch:

jobs:
  testpypi:
    runs-on: ubuntu-latest

    # Must match the environment registered with the TestPyPI publisher.
    environment: testpypi

    permissions:
      # Naming any scope sets every unnamed scope to `none`, so `contents`
      # has to be listed explicitly or `actions/checkout` cannot read the
      # repository.
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      # `always` rather than the default `automatic`: if the OIDC exchange
      # fails, fail here loudly instead of falling through to an anonymous
      # upload attempt that reports a confusing permissions error instead.
      - name: Publish to TestPyPI
        run: uv publish --index testpypi --trusted-publishing always
