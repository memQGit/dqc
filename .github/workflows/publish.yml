name: Publish

# Publishing is deliberately manual: a version number can never be reused on
# PyPI, so releases are cut by publishing a GitHub release rather than on
# every push to main.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest

    # Must match the environment registered with the PyPI trusted publisher.
    environment: pypi

    permissions:
      # Required for trusted publishing: uv exchanges this OIDC token for a
      # short-lived PyPI credential, so no API token is stored in the repo.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Verify the tag matches the project version
        run: |
          project_version="$(uv version --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match the" \
              "version in pyproject.toml ('$project_version')." >&2
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
