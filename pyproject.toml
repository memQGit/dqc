[project]
name = "memq-dqc"
version = "0.1.0"
description = "DQC — Distributed Quantum Compiler"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "memQ Inc.", email = "luke.andreesen@memq.tech" }
]
requires-python = ">=3.11"
dependencies = [
    # KaHyPar publishes no Windows wheels, so it is skipped there rather
    # than failing the whole install. Only HypergraphPartitioner needs it;
    # it raises a clear ImportError when the package is missing.
    "kahypar>=1.3.7; sys_platform != 'win32'",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "openqasm3[parser]>=1.0.1",
    "pylatexenc>=2.11",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
# The network builder is an optional local web tool, not part of the
# compiler. Flask stays out of the base install so that importing memq_dqc
# never pulls in a web stack.
builder = [
    "flask>=3.0,<4",
]

[project.scripts]
network-builder = "memq_dqc.network_builder.cli:main"

[project.urls]
Homepage = "https://github.com/memQGit/dqc"
Repository = "https://github.com/memQGit/dqc"
Issues = "https://github.com/memQGit/dqc/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# Publish target for the TestPyPI dry run only. `explicit = true` keeps it
# out of dependency resolution, so this cannot affect how the project's own
# requirements are resolved -- it is reachable solely via
# `uv publish --index testpypi`.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
docs = [
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=1.0.6",
]
dev = [
    { include-group = "docs" },
    # Mirrors the `builder` extra so `uv run network-builder` works from a
    # checkout without asking for extras explicitly.
    "flask>=3.0,<4",
    "notebook>=7.5.3",
    "pre-commit>=4.6.2",
    "pydoclint>=0.9.1",
    "pyright[nodejs]>=1.1.411",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "qiskit>=2.5.2",
    "qiskit_qasm3_import>=0.5",
    "ruff>=0.16.3",
    "tox>=4.60.0",
]

[tool.pytest.ini_options]
# Collect only the library's own suite. `studio/` is a local, experimental
# application that is not part of the released package.
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = ["studio"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "D", "ANN", "UP", "B"]
per-file-ignores = { "tests/**" = ["D", "ANN"], "scripts/**" = ["D", "ANN"], "demo/**" = ["ANN"] }

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = false
suppress-none-returning = false
mypy-init-return = true
