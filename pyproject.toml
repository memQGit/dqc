[project]
name = "memq-dqc"
version = "0.1.0"
description = "memQ Distributed Quantum Compiler"
readme = "README.md"
authors = [
    { name = "LukeAndreesen", email = "luke.andreesen@memq.tech" }
]
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pydoclint>=0.8.3",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "D"]
per-file-ignores = { "tests/**" = ["D"] }

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"


