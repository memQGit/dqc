[project]
name = "memq-dqc"
version = "0.1.0"
description = "memQ Distributed Quantum Compiler"
readme = "README.md"
authors = [
    { name = "memQ Inc.", email = "luke.andreesen@memq.tech" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "openqasm3[parser]>=1.0.1",
    "qiskit>=2.3.0",
    "qiskit-aer>=0.17.2",
]

classifiers = [
    "Intended Audience :: Science/Research",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "notebook>=7.5.3",
    "pre-commit>=4.5.1",
    "pydoclint>=0.8.3",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "qiskit>=1.0",
    "qiskit_qasm3_import>=0.5",
    "ruff>=0.14.11",
    "tox>=4.25.0",
]

[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = ["examples/**/*.ipynb"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "D", "ANN", "UP", "B"]
per-file-ignores = { "tests/**" = ["D", "ANN"], "scripts/**" = ["D", "ANN"] }

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = false
suppress-none-returning = false
mypy-init-return = true
