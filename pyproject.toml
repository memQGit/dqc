[project]
name = "memq-dqc"
version = "0.1.0"
description = "memQ Distributed Quantum Compiler"
readme = "README.md"
authors = [
    { name = "LukeAndreesen", email = "107073823+LukeAndreesen@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.6.1",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.11",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
ignore = ["E501"]
