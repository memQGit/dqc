[project]
name = "xdqc"
version = "0.1.0"
description = "memQ Distributed Quantum Compiler"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "memQ Inc.", email = "luke.andreesen@memq.tech" }
]
requires-python = ">=3.11"
dependencies = [
    "kahypar>=1.3.7",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "openqasm3[parser]>=1.0.1",
    "pulp>=3.3.0",
    "pylatexenc>=2.10",
    "qiskit>=2.3.0",
    "qiskit-aer>=0.17.2",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/memQGit/xdqc"
Repository = "https://github.com/memQGit/xdqc"
Issues = "https://github.com/memQGit/xdqc/issues"

[build-system]
requires = ["uv_build>=0.9.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "notebook>=7.5.3",
    "pre-commit>=4.5.1",
    "pydoclint>=0.8.3",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "qiskit>=1.0",
    "qiskit_qasm3_import>=0.5",
    "ruff>=0.14.11",
    "tox>=4.25.0",
]

[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = ["examples/**/*.ipynb"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "D", "ANN", "UP", "B"]
per-file-ignores = { "tests/**" = ["D", "ANN"], "scripts/**" = ["D", "ANN"] }

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = false
suppress-none-returning = false
mypy-init-return = true
