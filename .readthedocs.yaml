# Read the Docs build configuration.
# Reference: https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  # Match the local `mkdocs build --strict` gate: broken links or bad
  # mkdocstrings references fail the build instead of shipping silently.
  fail_on_warning: true

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
