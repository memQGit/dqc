[tox]
envlist = lint, format, test
requires =
    tox>=4.25

[testenv]
package = editable

[testenv:lint]
description = Run Ruff lint checks
deps =
    ruff>=0.14
commands =
    ruff check . --exclude "examples/*.ipynb"

[testenv:format]
description = Run Ruff format checks
deps =
    ruff>=0.14
commands =
    ruff format --check . --exclude "examples/*.ipynb"

[testenv:test]
description = Run tests with coverage
deps =
    pytest>=9.0
    pytest-cov>=7.0
    qiskit>=1.0
    qiskit_qasm3_import>=0.5
commands =
    pytest -q --cov=memq_dqc --cov-report=term-missing
