site_name: DQC
site_description: >-
  DQC (Distributed Quantum Compiler) — an open-source Python
  library for distributed quantum compilation: partition circuits across
  QPUs, route inter-QPU gates, reconstruct distributed circuits, and build
  execution schedules.
site_author: memQ Inc.
repo_name: memQGit/dqc
repo_url: https://github.com/memQGit/dqc
copyright: Copyright &copy; 2026 memQ Inc.

# mkdocs.yml now lives alongside the doc content it configures (docs/),
# so docs_dir must be repointed here and site_dir kept at the repo root
# to preserve the existing site/ build-output location.
docs_dir: .
site_dir: ../site

theme:
  name: material
  logo: assets/memq-logo-white.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - gen-files:
      scripts:
        - gen_ref_pages.py
        - gen_demo_pages.py
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: false
      # gen_ref_pages.py / gen_demo_pages.py are build scripts that now
      # live inside docs_dir (they moved in alongside mkdocs.yml), not
      # content -- keep mkdocs-jupyter from rendering them as notebooks.
      ignore:
        - gen_ref_pages.py
        - gen_demo_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            show_if_no_docstring: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters:
              - "!^_"

markdown_extensions:
  # `generic: true` emits MathJax-agnostic markup that
  # javascripts/mathjax.js then typesets; needed by guide/scheduling.md
  # and guide/hardware.md, which state their timing models as equations.
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Key Features: key-features.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guide:
      - Workflow & Architecture: guide/workflow.md
      - Network Topology Format: guide/networks.md
      - Network Builder: guide/network-builder.md
      - Bundled Networks & Circuits: guide/bundled-assets.md
      - Partitioning Algorithms: guide/partitioning.md
      - Hardware & Settings: guide/hardware.md
      - Scheduling Strategies: guide/scheduling.md
      - Visualization: guide/visualization.md
      - Logging & Verbosity: guide/logging.md
      - Scheduling-Instance API: guide/scheduling-instance-api.md
  - Demos:
      - Overview: demo.md
      - Basic Workflow: demos/demo.ipynb
      - Defining Networks: demos/networks.ipynb
      - Comparing Partitioners: demos/comparing_partitioners.ipynb
      - Scheduling & Hardware: demos/scheduling_and_hardware.ipynb
      - Visualization: demos/visualization.ipynb
  - API Reference: reference/
